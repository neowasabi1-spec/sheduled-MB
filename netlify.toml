[build]
  # Sito statico: sovrascrive l'eventuale "npm run build" impostato nella UI di Netlify
  # Copia anche in .next: il plugin Next.js (installato dalla UI del progetto)
  # forza ".next" come cartella di deploy; così la trova piena invece che assente.
  command = "mkdir -p .next && cp index.html config.js .next/"
  publish = "."

# Il progetto Netlify ha il plugin Next.js installato dalla UI (ereditato dal
# vecchio progetto): questa variabile gli dice di non fare nulla.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Sito statico: nessuna build. Niente cache aggressiva così gli aggiornamenti
# (incluso config.js) arrivano subito a tutti i buyer.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
